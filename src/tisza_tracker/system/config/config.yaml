    url: "https://hvg.hu/rss"
    enabled: true
  nepszava:
    name: "Népszava"
    url: "https://nepszava.hu/feed"
    enabled: true

  # --- Large portals / mixed ---
  index:
    name: "Index"
    url: "https://index.hu/24ora/rss"
    enabled: true
  24hu:
    name: "24.hu"
    url: "https://24.hu/feed/"
    enabled: true
  hirado:
    name: "Híradó.hu"
    url: "https://hirado.hu/feed/"
    enabled: true  # HTTP 500 as of 2026-04-13 — server issue, keep trying
  origo:
    name: "Origo"
    url: "https://www.origo.hu/contentpartner/rss/hircentrum/origo.xml"
    enabled: false  # 404 as of 2026-04-13 — RSS discontinued?
  rtl:
    name: "RTL.hu"
    url: "https://rtl.hu/rss"
    enabled: false  # 404 as of 2026-04-13 — RSS discontinued?

  # --- Business / economics ---
  portfolio:
    name: "Portfolio"
    url: "https://www.portfolio.hu/rss/all.xml"
    enabled: true
  vg:
    name: "Világgazdaság"
    url: "https://vg.hu/feed"
    enabled: true
  # g7 removed — redirects to telex.hu/rss (G7 merged into Telex)

  # --- Government-aligned / right-leaning ---
  magyarnemzet:
    name: "Magyar Nemzet"
    url: "https://magyarnemzet.hu/feed/"
    enabled: true
  mandiner:
    name: "Mandiner"
    url: "https://mandiner.hu/rss"
    enabled: true
  168hu:
    name: "168.hu"
    url: "https://168.hu/rss"
    enabled: true

  # --- English-language ---
  hungarytoday:
    name: "Hungary Today"
    url: "https://hungarytoday.hu/feed"
    enabled: true
  budapesttimes:
    name: "Budapest Times"
    url: "https://budapesttimes.hu/feed"
    enabled: true

  # --- Government official ---
  kormany:
    name: "Kormány.hu"
    url: "https://kormany.hu/api/rss"
    enabled: false  # 404 as of 2026-04-13 — no RSS endpoint found

defaults:
  time_window_days: 30
  top_n_per_topic: 20
  rank_threshold: 0.25
  ranking_negative_penalty: 0.20
  fetch_threshold: 0.40

promises:
  yaml_dir: "promises"

# The government whose promises are tracked.  Nothing dated before it took
# office counts as evidence.
government:
  election_date: "2026-04-12"
  took_office: "2026-05-12"

# LLM classification: for each matched article a cheap model first checks
# relevance, then a second pass extracts who did what (actor, kind of act,
# scope, date, quote).  Code turns that record into a signal and rolls the
# signals up into a status.  Runs after `tt match`, before `tt report`.
llm_classification:
  enabled: true
  model: "gpt-5-nano"                # pass 1 (relevance gate); overrides OPENAI_MODEL env
  pass2_model: "gpt-5-mini"          # pass 2 (evidence extraction)
  pass2_reasoning_effort: "low"      # null → omit the parameter (non-OpenAI endpoints)
  base_url: null                     # null → use OPENAI_BASE_URL env or OpenAI default
  api_key_env: "OPENAI_API_KEY"
  api_key_file: null                 # alternative: read from secrets dir
  max_candidates_per_promise: 20     # cap links per promise sent to the LLM per run
  top_n_in_report: 3                 # how many articles appear per promise row
  prompt_version: "v1"               # bump to invalidate cached extractions
  request_timeout: 30
  max_retries: 2                     # retries within one call
  max_attempts: 3                    # runs after which a failing link is given up
  min_body_chars: 300                # shorter bodies count as headline-only
  pass1_enabled: true                # cheap relevance gate (title + summary)
  pass2_enabled: true                # evidence extraction (uses article full_text)
  rollup:
    enabled: true
    min_outlets: 2                   # outlets needed for kept / partially kept / reversal
    deadline_grace_days: 30          # days past a deadline before it is flagged
    auto_publish_broken: false       # false → a corroborated reversal goes to
                                     # `tt promise review` instead of the tracker
